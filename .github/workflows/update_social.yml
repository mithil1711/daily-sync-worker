name: Update Member Social Status

on:
  workflow_dispatch:
    inputs:
      player_tag:
        description: 'Player Tag (e.g. #2PP)'
        required: true
        type: string
      status:
        description: 'Social Presence'
        required: true
        type: choice
        options:
          - None
          - Discord
          - Instagram
          - Both

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update socials.json
        run: |
          python3 -c '
          import json
          tag = "${{ inputs.player_tag }}".strip().upper()
          if not tag.startswith("#"): tag = "#" + tag
          with open("data/socials.json", "r") as f:
              data = json.load(f)
          if "${{ inputs.status }}" == "None":
              data.pop(tag, None)
          else:
              data[tag] = "${{ inputs.status }}"
          with open("data/socials.json", "w") as f:
              json.dump(data, f, indent=2)
          '
      - name: Commit change
        run: |
          git config user.name "CW2 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/socials.json
          git diff --staged --quiet || git commit -m "Update social status for ${{ inputs.player_tag }}"
          git push
