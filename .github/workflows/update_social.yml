name: Update Member Social Status

on:
  workflow_dispatch:
    inputs:
      player_tag:
        description: 'Player Tag (e.g. #2PP)'
        required: true
        type: string
      status:
        description: 'Social Presence'
        required: true
        type: choice
        options:
          - None
          - Discord
          - Instagram
          - Both

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest main
        run: git pull --ff-only origin main
      - name: Update socials.json
        env:
          PLAYER_TAG: ${{ inputs.player_tag }}
          SOCIAL_STATUS: ${{ inputs.status }}
        run: |
          python3 -c '
          import json, os
          tag = os.environ["PLAYER_TAG"].strip().upper()
          if not tag.startswith("#"): tag = "#" + tag
          status = os.environ["SOCIAL_STATUS"]
          with open("data/socials.json", "r") as f:
              data = json.load(f)
          if status == "None":
              data.pop(tag, None)
          else:
              data[tag] = status
          with open("data/socials.json", "w") as f:
              json.dump(data, f, indent=2)
          '
      - name: Commit change
        env:
          PLAYER_TAG: ${{ inputs.player_tag }}
        run: |
          git config user.name "CW2 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/socials.json
          git diff --staged --quiet || git commit -m "Update social status for $PLAYER_TAG"
          git push
