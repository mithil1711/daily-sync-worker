name: Update Member Social Status

on:
  workflow_dispatch:
    inputs:
      player_tag:
        description: 'Player Tag (e.g. #2PP)'
        required: true
        type: string
      status:
        description: 'Social Presence'
        required: true
        type: choice
        options:
          - None
          - Discord
          - Instagram
          - Both

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update socials.json & check Elder eligibility
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLAN_TAG: ${{ secrets.CLAN_TAG }}
          ADMIN_ROLE_ID: ${{ secrets.ADMIN_ROLE_ID }}
          KICK_THRESHOLD: ${{ vars.KICK_THRESHOLD || '900' }}
          SAFE_THRESHOLD: ${{ vars.SAFE_THRESHOLD || '1800' }}
          ELDER_SAFE_THRESHOLD: ${{ vars.ELDER_SAFE_THRESHOLD || '2400' }}
          PLAYER_TAG: ${{ inputs.player_tag }}
          SOCIAL_STATUS: ${{ inputs.status }}
        run: python3 bot.py --social-tag "$PLAYER_TAG" --social-status "$SOCIAL_STATUS"

      - name: Commit change
        env:
          PLAYER_TAG: ${{ inputs.player_tag }}
        run: |
          git config user.name "CW2 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/socials.json
          git diff --staged --quiet || git commit -m "Update social status for $PLAYER_TAG"
          git push
