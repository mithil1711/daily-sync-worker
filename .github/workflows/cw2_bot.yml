name: Clash Royale CW2 Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run CW2 Bot
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLAN_TAG: ${{ vars.CLAN_TAG }}
          ADMIN_ROLE_ID: ${{ vars.ADMIN_ROLE_ID }}
          KICK_THRESHOLD: ${{ vars.KICK_THRESHOLD }}
          SAFE_THRESHOLD: ${{ vars.SAFE_THRESHOLD }}
          ELDER_SAFE_THRESHOLD: ${{ vars.ELDER_SAFE_THRESHOLD }}
        run: python bot.py

      - name: Commit updated data
        run: |
          git config user.name "CW2 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update CW2 roster and war state"
          git push
