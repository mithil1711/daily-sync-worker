name: Manual Player Score

on:
  workflow_dispatch:
    inputs:
      player_tag:
        description: "Player Tag (e.g. #QQUCLPGRC)"
        required: true
        type: string
      score:
        description: "Last War Medals (e.g. 2000)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  manual-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Record Manual Score
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLAN_TAG: ${{ vars.CLAN_TAG }}
          ADMIN_ROLE_ID: ${{ vars.ADMIN_ROLE_ID }}
          KICK_THRESHOLD: ${{ vars.KICK_THRESHOLD }}
          SAFE_THRESHOLD: ${{ vars.SAFE_THRESHOLD }}
          ELDER_SAFE_THRESHOLD: ${{ vars.ELDER_SAFE_THRESHOLD }}
        run: python bot.py --manual-tag "${{ inputs.player_tag }}" --manual-score "${{ inputs.score }}"

      - name: Commit updated roster
        run: |
          git config user.name "CW2 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/roster.json
          git diff --staged --quiet || git commit -m "Manual score for ${{ inputs.player_tag }}"
          git push
